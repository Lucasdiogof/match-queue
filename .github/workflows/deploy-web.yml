# Copy to .github/workflows/deploy-web.yml and edit the env block.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, WEB_ENV_JSON (the JSON of env/production.json with APP_LINK_HOST=matchqueue.lucksrei.com; public keys only).
# Safety switch: nothing runs on push until the repo VARIABLE AUTO_DEPLOY is "true"
# (Settings > Secrets and variables > Actions > Variables). Manual runs always work.
# Public domain: stays off until the `routes` block in wrangler.jsonc is uncommented (after QA approval).
# Cost: public repos run Actions free; private repos use the 2,000 min/month quota (blocked, not billed, without a payment method).
name: Deploy web to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: true
env:
  FLUTTER_VERSION: "3.47.4"        # pin to the version the app is developed with
  APP_DIR: "."                      # folder with pubspec.yaml and wrangler.jsonc (OrbiJob: app)
  FLUTTER_WEB_FLAGS: ""             # e.g. --no-web-resources-cdn
  SMOKE_URLS: "https://matchqueue.lucksrei.com https://matchqueue-web.lucasdiogo1234.workers.dev"
  SMOKE_ROUTES: "/login /privacy /terms /join/smoke-check /u/smoke-check"  # SPA deep links that must fall back to index.html
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write the web environment file (kept out of git)
        env:
          WEB_ENV_JSON: ${{ secrets.WEB_ENV_JSON }}
        run: |
          mkdir -p env
          printf '%s' "$WEB_ENV_JSON" > env/web.json
      - name: Stub lib/firebase_options.dart when absent (gitignored; the web build never initializes Firebase)
        run: |
          [ -f lib/firebase_options.dart ] && exit 0
          cat > lib/firebase_options.dart <<'DART'
          // CI stub for web builds: the real file is gitignored and Firebase is skipped on the web (kIsWeb).
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform =>
                throw UnsupportedError('Firebase is not used on the web build');
          }
          DART
          sed -i 's/^          //' lib/firebase_options.dart
      - run: flutter build web --release $FLUTTER_WEB_FLAGS --dart-define-from-file=env/web.json
      - run: bash scripts/check-bundle-secrets.sh build/web
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.APP_DIR }}
          command: deploy
      - name: Smoke test (public URLs, fails the workflow on a bad publish)
        run: |
          for u in $SMOKE_URLS; do bash scripts/smoke-test.sh "$u" $SMOKE_ROUTES || exit 1; done
