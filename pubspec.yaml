name: fifa_queue
description: "FIFA Queue - coordena a fila de busca de partidas de um time em EA SPORTS FC."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "design/brand/generated/icon_general_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "design/brand/generated/icon_adaptive_fg_1024.png"
  web:
    generate: true
    image_path: "design/brand/generated/icon_general_1024.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: design/brand/generated/splash_source_1024.png
  color_dark: "#FFFFFF"
  image_dark: design/brand/generated/splash_source_1024.png
  android_12:
    image: design/brand/generated/splash_source_1024.png
    color: "#FFFFFF"
    image_dark: design/brand/generated/splash_source_1024.png
    color_dark: "#FFFFFF"
  web: false
